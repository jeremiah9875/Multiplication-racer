<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Multiplication Racer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#6a5cff,#00c9a7);min-height:100vh;color:#172033}
button,input{font:inherit}
.app{max-width:900px;margin:auto;padding:18px}
.card{background:#ffffffee;border-radius:24px;padding:22px;box-shadow:0 15px 45px #16213d40}
h1{text-align:center;margin:4px 0 6px;font-size:clamp(34px,8vw,64px);color:#5b35d5}
.subtitle{text-align:center;margin:0 0 18px;color:#536078}
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.mode{border:0;border-radius:14px;padding:12px 20px;background:#e9ecf5;cursor:pointer;font-weight:800}
.mode.active{background:#ffbd35;color:#432900;transform:translateY(-2px)}
.start{display:block;margin:12px auto 20px;border:0;border-radius:16px;padding:15px 34px;background:#16b96e;color:white;font-weight:900;font-size:20px;cursor:pointer;box-shadow:0 7px 0 #09804a}
.start:active{transform:translateY(4px);box-shadow:0 3px 0 #09804a}
.hud{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.stat{background:#f1f4fb;border-radius:14px;padding:9px 16px;text-align:center;min-width:110px}
.stat b{display:block;font-size:22px}
.track{height:210px;border-radius:18px;overflow:hidden;position:relative;background:repeating-linear-gradient(0deg,#55b947 0 32px,#49aa3d 32px 64px);border:5px solid #293248}
.road{position:absolute;left:0;right:0;top:45px;height:120px;background:#454c59}
.lane{position:absolute;top:102px;left:0;right:0;border-top:5px dashed #f8f1a8}
.finish{position:absolute;right:8px;top:45px;height:120px;width:16px;background:repeating-linear-gradient(45deg,#fff 0 8px,#222 8px 16px)}
.car{position:absolute;left:10px;top:74px;font-size:62px;transition:left .35s ease;filter:drop-shadow(2px 4px 2px #1116);z-index:2}
.question{margin:18px auto 10px;text-align:center;font-size:clamp(34px,9vw,58px);font-weight:1000}
.answerRow{display:flex;gap:10px;max-width:520px;margin:auto}
#answer{flex:1;min-width:0;border:3px solid #cfd5e4;border-radius:14px;padding:13px;text-align:center;font-size:24px;outline:none}
#answer:focus{border-color:#6a5cff}
.check{border:0;border-radius:14px;padding:0 20px;background:#5b35d5;color:white;font-weight:900;cursor:pointer}
.message{text-align:center;min-height:30px;font-weight:800;margin:12px 0 0}
.hidden{display:none}
.small{text-align:center;color:#667085;font-size:14px;margin-top:10px}
@media(max-width:520px){.app{padding:10px}.card{padding:15px}.answerRow{flex-direction:column}.check{padding:13px}.track{height:180px}.road{top:40px;height:100px}.finish{top:40px;height:100px}.car{top:65px}}
</style>
</head>
<body>
<div class="app"><div class="card">
<h1>🏁 Multiplication Racer 🏎️</h1>
<p class="subtitle">Answer fast to race your car to the finish!</p>

<div class="modes" aria-label="Game modes">
<button class="mode active" data-mode="easy">Easy</button>
<button class="mode" data-mode="hard">Hard</button>
<button class="mode" data-mode="impossible">Impossible</button>
</div>
<button id="start" class="start">▶ Start Race</button>

<div id="game" class="hidden">
<div class="hud">
<div class="stat">Mode<b id="modeLabel">Easy</b></div>
<div class="stat">Progress<b id="progress">0 / 10</b></div>
<div class="stat">Score<b id="score">0</b></div>
</div>
<div class="track">
<div class="road"></div><div class="lane"></div><div class="finish"></div>
<div id="car" class="car">🏎️</div>
</div>
<div id="question" class="question">0 × 0 = ?</div>
<div class="answerRow">
<input id="answer" type="number" inputmode="numeric" autocomplete="off" aria-label="Answer">
<button id="check" class="check">GO!</button>
</div>
<div id="message" class="message"></div>
<p class="small">10 correct answers wins the race. Wrong answers don't move your car.</p>
</div>
<div id="welcome" class="small">Choose a mode, then press Start Race.</div>
</div></div>

<script>
(() => {
"use strict";
const state={mode:"easy",a:0,b:0,correct:0,score:0,started:false};
const settings={
 easy:{max:6,time:0,label:"Easy"},
 hard:{max:12,time:0,label:"Hard"},
 impossible:{max:12,time:5000,label:"Impossible"}
};
const $=id=>document.getElementById(id);
const modes=document.querySelectorAll(".mode");

function randomInt(max){return Math.floor(Math.random()*(max+1))}
function newQuestion(){
 const s=settings[state.mode];
 state.a=randomInt(s.max); state.b=randomInt(s.max);
 $("question").textContent=`${state.a} × ${state.b} = ?`;
 $("answer").value="";
 $("answer").focus();
}
function update(){
 $("progress").textContent=`${state.correct} / 10`;
 $("score").textContent=state.score;
 $("modeLabel").textContent=settings[state.mode].label;
 $("car").style.left=`calc(${Math.min(state.correct*9.3,93)}% - 10px)`;
}
function message(t,ok=false){
 const m=$("message"); m.textContent=t; m.style.color=ok?"#09804a":"#d04444";
}
function finish(){
 state.started=false;
 $("answer").disabled=true; $("check").disabled=true;
 $("question").textContent="🏆 FINISH!";
 message(`You won the ${settings[state.mode].label} race with ${state.score} points!`,true);
 $("start").textContent="🔄 Race Again";
}
function check(){
 if(!state.started)return;
 const value=Number($("answer").value);
 if($("answer").value.trim()===""||!Number.isFinite(value)){message("Type an answer first!");return}
 if(value===state.a*state.b){
   state.correct++; state.score+=state.mode==="impossible"?30:state.mode==="hard"?20:10;
   update();
   if(state.correct>=10){finish();return}
   message("✅ Correct! Your car is moving!",true);
   newQuestion();
 }else{
   message("❌ Not quite—try again!");
   $("answer").select();
 }
}
modes.forEach(btn=>btn.addEventListener("click",()=>{
 modes.forEach(x=>x.classList.remove("active"));
 btn.classList.add("active"); state.mode=btn.dataset.mode;
 if(!state.started){$("modeLabel").textContent=settings[state.mode].label}
}));
$("start").addEventListener("click",()=>{
 state.correct=0;state.score=0;state.started=true;
 $("game").classList.remove("hidden");$("welcome").classList.add("hidden");
 $("answer").disabled=false;$("check").disabled=false;
 $("start").textContent="↻ Restart Race";update();newQuestion();message("🏁 Go!");
});
$("check").addEventListener("click",check);
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
})();
</script>
</body>
</html>
